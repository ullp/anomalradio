name: pages

# Publishes the static snapshot to GitHub Pages so the domain serves the real website instead of the
# repository README. A file host cannot run the station (no Node, no database, no private storage),
# so the snapshot is explicit about that: pages and catalogue are real, playback needs the server.
#
# The real deployment — stream, tokens, shop, admin — runs the Node app on a VPS behind nginx.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # No database on CI, so the builder uses the committed metadata export (data/tracks.json).
      - name: Build the static snapshot
        run: node scripts/build-static.js --out _site --base-url https://anomalradio.com

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
