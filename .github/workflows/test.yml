name: test

# The security contract in tests/ is only a contract if it is enforced. This runs the
# suite (and the linter) on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # ffmpeg/ffprobe: needed by the import pipeline suite (tests/importer.test.js) and by
      # tests/library.test.js. Both skip themselves when it is missing, but installing it means the
      # pipeline is actually exercised on CI.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
