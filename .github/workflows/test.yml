name: test

# The security contract in tests/ is only a contract if it is enforced. This runs the
# suite (and the linter) on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # ffmpeg/ffprobe: needed by the import pipeline suite (tests/importer.test.js) and by
      # tests/library.test.js. Both skip themselves when it is missing, but installing it means the
      # pipeline is actually exercised on CI.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  nginx:
    # Pinned, not `ubuntu-latest`: the value of this job is that its nginx is the same
    # version the instance runs. The `ubuntu-latest` label is migrating to Ubuntu 26,
    # which would quietly move the gate onto a newer nginx and stop testing the target.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The deploy configs are otherwise only checked by regex, and a regex cannot tell
      # you that nginx accepts the file. ubuntu-latest ships the same nginx 1.24 as the
      # Ubuntu 24.04 instance, so a directive that needs a newer version fails here rather
      # than at go-live, where there is no shell to fix it.
      - name: Install nginx
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nginx

      - name: Verify the deploy nginx configs
        run: bash scripts/verify-nginx.sh
