# ─────────────────────────────────────────────────────────────────────────────
#  bootstrap.conf — plain HTTP only, used until Let's Encrypt has issued a
#  certificate (the TLS config cannot load before the certificate exists, so
#  nginx would refuse to start and certbot would have nothing to answer with).
#
#  deploy/bin/deploy.sh installs this automatically when no certificate is
#  present yet, and swaps to anomalradio.conf once one is.
# ─────────────────────────────────────────────────────────────────────────────

upstream anomalradio_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name anomalradio.com www.anomalradio.com;

    # certbot --webroot answers the ACME challenge from here.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    client_max_body_size 1m;
    server_tokens off;

    location ~ ^/radio(-[0-9]+)?\.mp3$ {
        proxy_pass http://anomalradio_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # OVERWRITE, never append — the app takes the first value.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffering here would turn the endless stream into a download.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 12h;
        proxy_send_timeout 12h;
        gzip off;
        add_header X-Accel-Buffering "no" always;
    }

    location / {
        proxy_pass http://anomalradio_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Defence in depth: nothing outside public/ is reachable even if a route appears.
    location ~ ^/(media|data|server|scripts|tests|_data|deploy)/ { return 404; }
    location ~ /\.(?!well-known) { return 404; }
    location ~* \.(db|sqlite3?|log|bak|old|env)$ { return 404; }
}
