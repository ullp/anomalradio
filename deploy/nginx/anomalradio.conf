# ─────────────────────────────────────────────────────────────────────────────
#  anomalradio.conf — nginx site for the station (TLS).
#
#  Install:  cp deploy/nginx/anomalradio.conf /etc/nginx/sites-available/anomalradio
#            ln -sf ../sites-available/anomalradio /etc/nginx/sites-enabled/
#            nginx -t && systemctl reload nginx
#
#  Three rules here are load-bearing for the security model. Do not "tidy" them:
#
#   1. X-Forwarded-For is OVERWRITTEN with $remote_addr, never appended with
#      $proxy_add_x_forwarded_for. The app takes the *first* value, so appending
#      would let any client choose its own apparent IP — walking straight around
#      the per-IP rate limit, the stream concurrency cap and token/IP binding.
#
#   2. Buffering is off on the mount. A buffering proxy turns the endless stream
#      into store-and-forward, which is the exact thing the mount exists to
#      prevent: a file you can save.
#
#   3. The mount is NOT matched by the `\.mp3$` deny rule below, and must never
#      be. It ends in .mp3 on purpose (players sniff it), but it is a stream, not
#      a file — the deny rule is scoped to extensions only used by real files.
# ─────────────────────────────────────────────────────────────────────────────

upstream anomalradio_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name anomalradio.com www.anomalradio.com;

    # ACME challenges stay on plain HTTP — certbot renews through this.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/2: Ubuntu 24.04 ships nginx 1.24, where the `http2 on;` directive does not
    # exist (it needs 1.25.1) and nginx refuses to start. The `listen ... http2`
    # parameter works on 1.24 and on >= 1.25.1, where it is deprecated but not removed.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name anomalradio.com www.anomalradio.com;

    ssl_certificate     /etc/letsencrypt/live/anomalradio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anomalradio.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # No OCSP stapling: it needs a `resolver` directive and fails silently without one,
    # and its benefit is negligible for one long-lived audio connection.

    # Headers the app cannot set itself: it never sees the TLS hop.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;

    # ── the continuous mount ──
    # Keep this pattern in sync with MOUNT_PATH in the environment file.
    location ~ ^/radio(-[0-9]+)?\.mp3$ {
        proxy_pass http://anomalradio_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 12h;
        proxy_send_timeout 12h;
        chunked_transfer_encoding on;
        gzip off;

        # Live audio: nothing may cache or transform it on the way through.
        add_header Cache-Control "no-store" always;
        add_header X-Accel-Buffering "no" always;
    }

    # ── the site and the API ──
    location / {
        proxy_pass http://anomalradio_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    # ── defence in depth ──
    # The app only ever serves public/, so these should be unreachable anyway;
    # this makes sure a future routing mistake cannot expose them.
    location ~ ^/(media|data|server|scripts|tests|_data|deploy)/ { return 404; }
    location ~ /\.(?!well-known) { return 404; }
    location ~* \.(db|sqlite3?|log|bak|old|env)$ { return 404; }
}
